# Example teachers for indecis-teach label -teachers: command-line coding
# harnesses, in the style of Conclave's agents.
#
# The texts to label are injections by construction: each harness runs WITH
# NO TOOLS AT ALL, in an empty temporary directory, with our system prompt in
# place of its own. For pi-json, a tool call causes the response to be
# rejected.
teachers:
  - id: claude-sonnet
    model: sonnet            # identifies the model in the cache
    command:
      - claude
      - --print
      - --output-format
      - json
      - --model
      - sonnet
      - --tools
      - ""                   # no tools
      - --strict-mcp-config  # no MCP server
      - --no-session-persistence
    system_flag: --system-prompt
    input: stdin
    output: claude-json
    batch: 20
    max_chars: 1500          # the model only reads ~256 tokens
    concurrency: 1
    interval: 5s
    timeout: 10m

  - id: pi-minimax
    model: cadoles/minimax-m3
    command:
      - pi
      - --print
      - --no-session
      - --mode
      - json
      - --no-tools           # also covers extension tools
      # no --no-extensions: the cadoles-xolo provider is declared by an
      # extension
      - --no-skills
      - --no-context-files
      - --no-prompt-templates
      - --provider
      - cadoles-xolo
      - --model
      - cadoles/minimax-m3
    system_flag: --system-prompt
    input: file             # "@prompt.md": a batch exceeds an argument's limit
    output: pi-json
    batch: 20
    max_chars: 1500          # the model only reads ~256 tokens
    concurrency: 1
    interval: 5s             # same quota as the Xolo gateway: stay conservative
    timeout: 10m
