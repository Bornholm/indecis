name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable SIMD, the default build.
          - variant: simd
            goexperiment: simd
            noasm: ""
          # Scalar fallback: the build without SIMD must stay correct.
          - variant: scalar
            goexperiment: ""
            noasm: ""
          # Assembly kernels turned off.
          - variant: noasm
            goexperiment: simd
            noasm: "1"
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
      INDECIS_NOASM: ${{ matrix.noasm }}
      INDECIS_BEKKO_DIR: ${{ github.workspace }}/.bekko
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: |
            teacher/go.sum
            decision/go.sum
      # Parity tests need the bekko weights (MIT license, 210 MB); they are
      # skipped when the weights are missing.
      - name: Cache bekko
        uses: actions/cache@v5
        with:
          path: .bekko
          key: bekko-embedding-v1-a8m
      - name: Download bekko
        run: |
          mkdir -p .bekko
          for f in config.json model.safetensors tokenizer.json; do
            [ -s .bekko/$f ] || curl -sfL -o .bekko/$f \
              https://huggingface.co/hotchpotch/bekko-embedding-v1-a8m/resolve/main/$f
          done
      - name: Vet
        run: |
          go vet ./...
          (cd teacher && go vet ./...)
          (cd decision && go vet ./...)
      - name: Test
        run: |
          go test ./...
          (cd teacher && go test ./...)
          (cd decision && go test ./...)

  race:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          # The library has no dependency, hence no go.sum at the root.
          cache-dependency-path: decision/go.sum
      - name: Race detector
        run: go test -race ./...

  # The NEON kernels, under qemu: -cpu max has dotprod, so the int8 tests
  # must not skip.
  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - name: Install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Generated assembly
        run: python3 linalg/gen_neon.py | diff - linalg/kernel_arm64.s
      - name: Cross builds
        run: |
          for os in linux android darwin windows; do
            GOOS=$os GOARCH=arm64 go test -c -o /dev/null ./linalg
          done
      - name: Test
        working-directory: linalg
        run: |
          GOARCH=arm64 go test -c -o "$RUNNER_TEMP/linalg.test" .
          qemu-aarch64-static -cpu max "$RUNNER_TEMP/linalg.test" -test.v > "$RUNNER_TEMP/out.txt" || { cat "$RUNNER_TEMP/out.txt"; exit 1; }
          if grep -- '--- SKIP' "$RUNNER_TEMP/out.txt"; then exit 1; fi
          INDECIS_NOASM=1 qemu-aarch64-static -cpu max "$RUNNER_TEMP/linalg.test"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
